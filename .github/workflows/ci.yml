name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Verify web icon system
        run: npm run icons:check
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ACR: acrenzolopez01
      ACR_LOGIN_SERVER: acrenzolopez01.azurecr.io
      IMAGE_REPOSITORY: marquee
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Azure OIDC login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to shared ACR
        run: az acr login --name "$ACR"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push image
        id: image
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VERSION="$(node -p "require('./package.json').version")+run.${GITHUB_RUN_NUMBER}"
          BUILD_ID="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            --build-arg "MARQUEE_BUILD_VERSION=$VERSION" \
            --build-arg "MARQUEE_BUILD_COMMIT=$GITHUB_SHA" \
            --build-arg "MARQUEE_BUILD_ID=$BUILD_ID" \
            --build-arg "MARQUEE_BUILD_TIME=$BUILD_TIME" \
            --tag "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.WEBAPP_NAME }}
        run: |
          set -euo pipefail
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://${ACR_LOGIN_SERVER}"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

      - name: Report health
        continue-on-error: true
        env:
          SITE_URL: https://${{ vars.WEBAPP_NAME }}.azurewebsites.net
        run: |
          for attempt in $(seq 1 20); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent \
              "$SITE_URL/api/live" >/dev/null \
              && curl --connect-timeout 2 --max-time 5 --fail --silent \
              "$SITE_URL/api/ready" >/dev/null; then
              echo "Marquee is live and ready"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Marquee health endpoints did not become ready"
          exit 1
